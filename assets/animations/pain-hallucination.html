<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nomio - Hallucination</title>
<style>
  :root {
    --black: #282731;
    --gray-xdark: #6D6A72;
    --gray-dark: #CCC6CC;
    --gray-light: #EDEBED;
    --gray-xlight: #F8F7F8;
    --light-pink: #FFF5FF;
    --pink: #FFA8FF;
    --red: #FF8985;
    --white: #FFFFFF;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--light-pink);
    font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
    color: var(--black);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  .canvas-wrap {
    width: 340px; height: 200px;
    max-width: 100vw; max-height: 100vh;
    position: relative;
  }

  .canvas {
    position: absolute; inset: 0;
    background: var(--light-pink);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .chat {
    width: 304px; height: 168px;
    background: var(--white);
    border: 1px solid var(--gray-light);
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(40,39,49,0.06);
    display: flex; flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transition: opacity 320ms var(--ease);
  }
  .chat.show { opacity: 1; }

  .chat-header {
    flex: 0 0 auto;
    padding: 7px 10px;
    border-bottom: 1px solid var(--gray-light);
    display: flex; align-items: center; gap: 6px;
    font-size: 10px;
    color: var(--gray-xdark);
  }
  .chat-header .ai-icon { width: 12px; height: 12px; flex: 0 0 12px; }
  .chat-header b { font-weight: 500; color: var(--black); }

  .chat-body {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    padding: 8px 10px;
  }
  .messages {
    position: absolute;
    left: 10px; right: 10px; bottom: 8px;
    display: flex; flex-direction: column; gap: 6px;
    transition: transform 700ms var(--ease);
  }

  .row {
    display: flex; width: 100%;
    opacity: 0; transform: translateY(6px);
    transition: opacity 380ms var(--ease), transform 380ms var(--ease);
  }
  .row.show { opacity: 1; transform: translateY(0); }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }

  .bubble {
    max-width: 85%;
    padding: 7px 9px;
    font-size: 10.5px; line-height: 1.4;
    border-radius: 8px; color: var(--black);
    word-wrap: break-word; position: relative;
  }
  .row.user .bubble { background: var(--gray-light); border-bottom-right-radius: 3px; }
  .row.ai .bubble { background: var(--white); border: 1px solid var(--gray-light); border-bottom-left-radius: 3px; }

  .typing-bubble {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 8px 10px;
  }
  .typing-bubble .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--gray-xdark);
    animation: dot-pulse 1.1s var(--ease) infinite;
  }
  .typing-bubble .dot:nth-child(2) { animation-delay: 180ms; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 360ms; }
  @keyframes dot-pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  .caret {
    display: inline-block; width: 1px; height: 11px;
    background: var(--black); margin-left: 1px;
    vertical-align: -1px;
    animation: caret-blink 1s steps(2, start) infinite;
  }
  @keyframes caret-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .halluc { position: relative; display: inline; }
  .halluc::after {
    content: "";
    position: absolute; left: 0; bottom: -1px;
    width: 0%; height: 1.5px;
    background: var(--red);
    transition: width 420ms var(--ease);
  }
  .halluc.mark::after { width: 100%; }

  .warning-badge {
    position: absolute; top: -5px; right: -5px;
    width: 14px; height: 14px;
    background: var(--red); color: var(--white);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
    opacity: 0; transform: scale(0.7);
    transition: opacity 320ms var(--ease), transform 320ms var(--ease);
    box-shadow: 0 1px 3px rgba(255,137,133,0.4);
  }
  .warning-badge.show { opacity: 1; transform: scale(1); }
  @media (max-width: 360px), (max-height: 220px) { .canvas-wrap { transform: scale(0.85); } }
</style>
</head>
<body>

<div class="canvas-wrap">
  <div class="canvas">
    <div class="chat" id="chat">
      <div class="chat-header">
        <svg class="ai-icon" viewBox="0 0 12 12" fill="#282731">
          <path d="M6 0.8 L7.1 4.9 L11.2 6 L7.1 7.1 L6 11.2 L4.9 7.1 L0.8 6 L4.9 4.9 Z"/>
        </svg>
        <b>AI Assistant</b>
      </div>
      <div class="chat-body">
        <div class="messages" id="messages"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const chat = $('#chat');
const messages = $('#messages');

const TOTAL = 11500;
let abortLoop = false;

function makeRow(side) {
  const row = document.createElement('div');
  row.className = 'row ' + side;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(bubble);
  messages.appendChild(row);
  void row.offsetWidth;
  row.classList.add('show');
  return { row, bubble };
}

async function typeInto(bubble, text, perChar) {
  const span = document.createElement('span');
  bubble.appendChild(span);
  const caret = document.createElement('span');
  caret.className = 'caret';
  bubble.appendChild(caret);
  for (let i = 0; i < text.length; i++) {
    span.appendChild(document.createTextNode(text[i]));
    await sleep(typeof perChar === 'function' ? perChar(i) : perChar);
  }
  caret.remove();
  return span;
}

async function showTypingIndicator() {
  const { row, bubble } = makeRow('ai');
  bubble.classList.add('typing-bubble');
  bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  return { row, bubble };
}

async function reset() {
  messages.innerHTML = '';
  chat.classList.remove('show');
  void chat.offsetWidth;
}

async function runLoop() {
  while (!abortLoop) {
    await reset();
    const start = performance.now();
    const tick = () => {
      const t = (performance.now() - start) / TOTAL;
      if (t < 1 && !abortLoop) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    chat.classList.add('show');
    await sleep(500);

    const user1 = makeRow('user');
    await typeInto(user1.bubble, 'Which contracts renew next quarter?', 38);
    await sleep(120);

    const indicator = await showTypingIndicator();
    await sleep(600);

    indicator.bubble.classList.remove('typing-bubble');
    indicator.bubble.innerHTML = '';
    const hallucSpan = document.createElement('span');
    hallucSpan.className = 'halluc';
    hallucSpan.id = 'halluc-target';
    hallucSpan.textContent = '';
    const before = document.createTextNode('The ');
    const after = document.createElement('span');
    after.id = 'after-halluc';
    indicator.bubble.appendChild(before);
    indicator.bubble.appendChild(hallucSpan);
    indicator.bubble.appendChild(after);

    const caret = document.createElement('span');
    caret.className = 'caret';
    indicator.bubble.appendChild(caret);

    const part1 = 'Pothos Data Enrichment';
    for (let i = 0; i < part1.length; i++) {
      hallucSpan.appendChild(document.createTextNode(part1[i]));
      await sleep(28);
    }
    caret.remove();
    const caret2 = document.createElement('span');
    caret2.className = 'caret';
    after.appendChild(caret2);
    const part2 = ' contract renews on 15 March 2026.';
    for (let i = 0; i < part2.length; i++) {
      after.insertBefore(document.createTextNode(part2[i]), caret2);
      await sleep(28);
    }
    caret2.remove();

    await sleep(600);

    const user2 = makeRow('user');
    await typeInto(user2.bubble, "We don't have a Data Enrichment contract.", 42);
    await sleep(120);

    await sleep(200);
    const target = document.getElementById('halluc-target');
    if (target) target.classList.add('mark');

    const badge = document.createElement('div');
    badge.className = 'warning-badge';
    badge.textContent = '!';
    indicator.bubble.style.position = 'relative';
    indicator.bubble.appendChild(badge);
    void badge.offsetWidth;
    badge.classList.add('show');

    await sleep(900);

    const ai2 = await showTypingIndicator();
    await sleep(450);
    ai2.bubble.classList.remove('typing-bubble');
    ai2.bubble.innerHTML = '';
    await typeInto(ai2.bubble, "You're right, there isn't a Pothos Data Enrichment contract.", 28);

    await sleep(700);
    chat.classList.remove('show');
    await sleep(400);
  }
}

runLoop();
window.addEventListener('beforeunload', () => { abortLoop = true; });
</script>
</body>
</html>
